# File: scripts/hooks/context-budget-adapters.conf
# Purpose: the runtime adapter table (stage3-design-v2 "Runtimes"): one row per
#          agent runtime, read by context-budget-hook.sh, the hook dispatcher.
#          Cells are '|'-separated, surrounding whitespace is ignored, '#' starts
#          a comment. Read with bash `read` only, so it loads before the jq check.
#
# runtime          the dispatcher's first argument; also the name budget_hook_exit
#                  announces when it terminates a session
# session id       payload:<jq path>  from the hook payload on stdin (stdin is read
#                                     only for these rows)
#                  arg                the dispatcher's third argument, no stdin
# transcript       what `check --transcript` receives at the check hook / at the
#   (check / end)  turn-end hook:
#                  payload:<jq path>  from the payload; must name an existing file
#                    +chain           state keyed per chain: the main transcript is
#                                     <sid>.jsonl, any other is a sidechain's and
#                                     must not consume the parent's slot (L32)
#                  copilot-state      $COPILOT_STATE_DIR/<sid>/events.jsonl
#                  chat-sessions      payload transcript_path -> ../../../chatSessions/<sid>.jsonl
#                  -                  none; the measurer discovers the artifact
# measure as       the measurer's --runtime, whose per-runtime adapter is the token
#                  method (last usage record: claude, codex, copilot; telemetry log:
#                  gemini; sqlite: opencode); also the hook state key prefix
# register         who runs `register`: config (the vendor config calls the
#                  measurer), agent (the agent runs it per the skill), hook (this
#                  dispatcher, on every firing until the registry record exists)
# pin              env var exported before the measurer runs, carrying the session
#                  identity it cannot take from the payload: <VAR>=sid | <VAR>=transcript | -
# check hook       <vendor event>:<envelope> — the hook that measures each turn:
#                  stderr-exit2   message on stderr, exit 2
#                  hso-event      {hookSpecificOutput:{hookEventName,additionalContext}}
#                  hso            {hookSpecificOutput:{additionalContext}}
#                  hso-json-only  hso, compact, and `{}` whenever silent (gemini demands JSON-only stdout)
#                  ctx            {additionalContext}
#                  text           the message as plain text on stdout
# turn-end hook    <vendor event>:<action> — the hook that ends a turn:
#                  sigterm        under the supervisor, SIGTERM the agent once it staged its successor
#                  sigterm+block  sigterm, then measure and at STOP {decision:"block",reason}
#                  block-stderr   measure and at STOP message on stderr + exit 2 (VS Code ignores a JSON block)
#                  decide         print "exit" when the session should end (opencode's plugin self-kills)
# logged out       what a vendor logout looks like in the transcript (the supervisor's
#                  discriminator; informational, the dispatcher does not read it)
#
# runtime        | session id          | transcript (check)             | transcript (end)        | measure as     | register | pin                                  | check hook                 | turn-end hook           | logged out
claude           | payload:.session_id | payload:.transcript_path+chain | -                       | claude         | config   | -                                    | PostToolUse:stderr-exit2   | Stop:sigterm            | last assistant turn isApiErrorMessage + authentication_failed + "Not logged in" (session-loop.sh child_logged_out)
codex            | payload:.session_id | payload:.transcript_path       | -                       | codex          | agent    | -                                    | UserPromptSubmit:hso-event | Stop:sigterm            | not captured
copilot          | payload:.sessionId  | copilot-state                  | payload:.transcriptPath | copilot-cli    | agent    | -                                    | sessionStart:ctx           | agentStop:sigterm+block | not captured
copilot-vscode   | payload:.session_id | chat-sessions                  | chat-sessions           | copilot-vscode | hook     | VSCODE_TARGET_SESSION_LOG=transcript | SessionStart:hso           | Stop:block-stderr       | n/a (editor pane, no supervisor)
gemini           | payload:.session_id | -                              | -                       | gemini         | agent    | -                                    | BeforeAgent:hso-json-only  | -                       | n/a (no exit hook; chains unsupported)
opencode         | arg                 | -                              | -                       | opencode       | agent    | OPENCODE_SESSION_ID=sid              | chat.message:text          | session.idle:decide     | not captured
