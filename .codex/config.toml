# Codex CLI repo config — context-budget WARN/STOP push (TADR-0003/0004).
# Trust: codex prompts once to trust this hook (hash-based; re-prompts on edit).
[[hooks.UserPromptSubmit]]
[[hooks.UserPromptSubmit.hooks]]
type = "command"
command = "scripts/hooks/context-budget-codex-hook.sh"
timeout = 30

# Registry record at session start: id + transcript from the payload (hook
# processes get no CODEX_* env). Seen firing in codex-cli 0.153.4, rollout
# already on disk (work/runtime-session-identity/probes/codex-cli.md).
[[hooks.SessionStart]]
[[hooks.SessionStart.hooks]]
type = "command"
command = "scripts/hooks/context-budget-codex-hook.sh SessionStart"
timeout = 30

# Session-loop supervisor exit. Verdict for codex 0.149.0 `Stop`: FIRES, observed
# live on 2026-08-26 (probe log never committed; verdict folded into
# docs/superpowers/specs/2026-08-21-session-loop-design.md) — the hook
# ran, TF_SESSION_LOOP survived the hook boundary, and SIGTERM to $PPID actually
# terminated the agent. Inert unless TF_SESSION_LOOP=1.
[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = "scripts/hooks/context-budget-stop-hook.sh codex"
timeout = 30
